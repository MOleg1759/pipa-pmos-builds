name: Xiaomi Pad 6 postmarketOS (edge)

on:
  workflow_dispatch:
    inputs:
      panel:
        description: 'Ревизия экрана (csot или tianma)'
        required: true
        default: 'csot'
        type: choice
        options:
          - csot
          - tianma
      ui:
        description: 'Графическая оболочка'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - plasma-desktop
          - gnome
          - plasma-mobile
          - phosh
          - none
  push:
    branches: [ master, main ]
  schedule:
    - cron: '0 0 * * 5'

jobs:
  build-image:
    runs-on: ubuntu-latest
    env:
      PANEL: ${{ github.event.inputs.panel || 'csot' }}
      SELECTED_UI: ${{ github.event.inputs.ui || 'all' }}

    steps:
      - name: Set current date variable
        run: echo "CURRENT_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Install dependencies for U-Boot and pmbootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-pip openssl \
            gcc-aarch64-linux-gnu bison flex libssl-dev libgnutls28-dev \
            bc device-tree-compiler python3-pyelftools uuid-dev mkbootimg

      - name: Create artifact directory
        run: mkdir -p out

      - name: Build U-Boot (u-boot-xiaomi-pipa.img)
        run: |
          git clone --depth=1 https://source.denx.de/u-boot/u-boot.git
          cd u-boot
          sed -i 's/^preboot=.*$/preboot=scsi scan; part start scsi 0 userdata userdata_start; part size scsi 0 userdata userdata_size; blkmap create root; blkmap map root 0 0x${userdata_size} linear scsi 0 0x${userdata_start}/' board/qualcomm/qcom-phone.env
          make qcom_defconfig qcom-phone.config
          ./scripts/config --enable CONFIG_BLKMAP --enable CONFIG_CMD_BLKMAP
          ./scripts/config --set-str CONFIG_DEFAULT_DEVICE_TREE "qcom/sm8250-xiaomi-pipa"
          CROSS_COMPILE=aarch64-linux-gnu- make -j"$(nproc)"
          gzip -f u-boot-nodtb.bin
          cat u-boot-nodtb.bin.gz u-boot.dtb > u-boot-xiaomi-pipa.bin
          mkbootimg --kernel u-boot-xiaomi-pipa.bin -o ../out/u-boot-xiaomi-pipa.img

      - name: Install pmbootstrap from git
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p ~/.local/bin
          ln -s "$PWD/pmbootstrap/pmbootstrap.py" ~/.local/bin/pmbootstrap
          pmbootstrap --version

      - name: Initialize pmbootstrap on edge (official main)
        run: |
          printf '\n%.0s' {1..25} | pmbootstrap init || true
          cd ~/.local/var/pmbootstrap/cache_git/pmaports
          git checkout main
          git pull origin main
          pmbootstrap config channel edge
          pmbootstrap config device xiaomi-pipa
          pmbootstrap config kernel "${PANEL}"
          pmbootstrap config user user
          pmbootstrap config systemd default
          pmbootstrap config jobs "$(nproc)"
          pmbootstrap status


      - name: Build KDE Plasma Desktop
        if: env.SELECTED_UI == 'all' || env.SELECTED_UI == 'plasma-desktop'
        run: |
          yes | pmbootstrap zap || true
          pmbootstrap config ui plasma-desktop
          pmbootstrap install --password 147147
          pmbootstrap export
          cp -L /tmp/postmarketOS-export/xiaomi-pipa.img "out/rootfs-xiaomi-pipa-${PANEL}-plasma-desktop.img"

      - name: Upload KDE Plasma Desktop + U-Boot
        if: env.SELECTED_UI == 'all' || env.SELECTED_UI == 'plasma-desktop'
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-pipa-${{ env.PANEL }}-plasma-desktop_${{ env.CURRENT_DATE }}
          path: |
            out/u-boot-xiaomi-pipa.img
            out/rootfs-xiaomi-pipa-${{ env.PANEL }}-plasma-desktop.img
          retention-days: 7

      - name: Build GNOME
        if: env.SELECTED_UI == 'all' || env.SELECTED_UI == 'gnome'
        run: |
          yes | pmbootstrap zap || true
          pmbootstrap config ui gnome
          pmbootstrap install --password 147147
          pmbootstrap export
          cp -L /tmp/postmarketOS-export/xiaomi-pipa.img "out/rootfs-xiaomi-pipa-${PANEL}-gnome.img"

      - name: Upload GNOME + U-Boot
        if: env.SELECTED_UI == 'all' || env.SELECTED_UI == 'gnome'
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-pipa-${{ env.PANEL }}-gnome_${{ env.CURRENT_DATE }}
          path: |
            out/u-boot-xiaomi-pipa.img
            out/rootfs-xiaomi-pipa-${{ env.PANEL }}-gnome.img
          retention-days: 7

      - name: Build Single Selected UI (plasma-mobile / phosh / none)
        if: env.SELECTED_UI != 'all' && env.SELECTED_UI != 'plasma-desktop' && env.SELECTED_UI != 'gnome'
        run: |
          yes | pmbootstrap zap || true
          pmbootstrap config ui "${SELECTED_UI}"
          pmbootstrap install --password 147147
          pmbootstrap export
          cp -L /tmp/postmarketOS-export/xiaomi-pipa.img "out/rootfs-xiaomi-pipa-${PANEL}-${SELECTED_UI}.img"

      - name: Upload Single Selected UI + U-Boot
        if: env.SELECTED_UI != 'all' && env.SELECTED_UI != 'plasma-desktop' && env.SELECTED_UI != 'gnome'
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-pipa-${{ env.PANEL }}-${{ env.SELECTED_UI }}_${{ env.CURRENT_DATE }}
          path: |
            out/u-boot-xiaomi-pipa.img
            out/rootfs-xiaomi-pipa-${{ env.PANEL }}-${{ env.SELECTED_UI }}.img
          retention-days: 7
